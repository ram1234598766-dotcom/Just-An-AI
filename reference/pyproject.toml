[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaa"
version = "0.2.0"
description = "J.A.A. - Just An AI Assistant: local-first agentic coding assistant with desktop automation and voice control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mrityunjay" }]
keywords = ["ai", "assistant", "coding", "agent", "ollama", "local", "llm"]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "textual>=0.52",
    "pyyaml>=6.0",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "langchain-core>=0.2",
    "langchain-ollama>=0.1",
    "langgraph>=0.1",
    "langgraph-checkpoint>=0.1",
    "ollama>=0.4",
    "psutil>=5.9",
    "anyio>=4.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "tenacity>=8.2",
    "structlog>=24.0",
    "orjson>=3.9",
    "duckduckgo-search>=6.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
cloud = [
    "openai>=1.30",
    "langchain-openai>=0.1",
    "anthropic>=0.25",
    "langchain-anthropic>=0.1",
    "google-generativeai>=0.7",
    "langchain-google-genai>=1.0",
]
memory = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.8",
    "networkx>=3.2",
]
coding = [
    "lsprotocol>=2024.0",
    "pygls>=1.0",
    "watchdog>=3.0",
    "gitpython>=3.1",
    "tree-sitter>=0.21",
    "tree-sitter-languages>=1.9",
]
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "onnxruntime>=1.16",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
automation = [
    "pyautogui>=0.9",
    "pynput>=1.8",
    "psutil>=5.9",
    "screeninfo>=0.8",
    "playwright>=1.40",
    "opencv-python>=4.9",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "black>=24.0",
    "isort>=5.13",
]

[project.scripts]
jaa = "jaa.cli.main:main"
jaa-daemon = "jaa.cli.daemon:main"
jaa-serve = "jaa.integrations.mcp.server:main"
jaa-voice = "jaa.cli.voice:main"

[tool.setuptools.packages.find]
include = ["jaa*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
